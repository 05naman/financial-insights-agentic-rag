[project]
name = "financial-insights-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "fastembed>=0.9.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "langgraph>=1.2.14",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pymupdf-layout>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "reportlab>=5.0.1",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP042", "E501"]
